name: Trigger auto deployment for unified-audit-vciso

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ feature/vciso-engine ]
    paths:
    - '**'
    - '.github/workflows/unified-audit-vciso-AutoDeployTrigger-aa2b6dfd-ec3d-48aa-b31d-9c062adb3f35.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.UNIFIEDAUDITVCISO_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.UNIFIEDAUDITVCISO_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.UNIFIEDAUDITVCISO_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrvcisoaudit.azurecr.io
          registryUsername: ${{ secrets.UNIFIEDAUDITVCISO_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.UNIFIEDAUDITVCISO_REGISTRY_PASSWORD }}
          containerAppName: unified-audit-vciso
          resourceGroup: Bradley
          imageToBuild: acrvcisoaudit.azurecr.io/unified-audit-vciso:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


