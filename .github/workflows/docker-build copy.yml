name: Build and Push Advisory Engine

on:
  push:
    branches:
      - main
      - feature/vciso-engine
  workflow_dispatch: # Allows manual triggering from the GitHub UI

env:
  REGISTRY: ghcr.io
  # Must be strictly lowercase to satisfy Docker registry rules
  IMAGE_NAME: Stephen-PlanetIT/mdr-use-case

jobs:
  build-and-push:
    if: github.repository_owner == 'Stephen-PlanetIT'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        # Required to emulate ARM architecture on GitHub's Intel runners
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Instructs Docker to compile for both architectures natively
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max