name: Push Mirror

on:
  push:
  workflow_dispatch:

# Explicitly grant read access for the default GITHUB_TOKEN
permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Execute bare clone and mirror push
        env:
          # Authenticates the source clone using the built-in ephemeral token
          SOURCE_REPO: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # Authenticates the destination push using your Fine-Grained PAT
          TARGET_REPO: "https://x-access-token:${{ secrets.DESTINATION_PAT }}@github.com/Gallenhamph/MDR-Use-Case"
        run: |
          git clone --bare $SOURCE_REPO temp-mirror-dir
          cd temp-mirror-dir
          git push --mirror $TARGET_REPO