services:
  advisory-engine:
    image: ghcr.io/gallenhamph/mdr-use-case:latest
    container_name: advisory-engine
    ports:
      - "8501:8501"
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - DOCKER_API_VERSION=1.41
      - REPO_USER=collisbradley@gmail.com
      - REPO_PASS=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
    restart: unless-stopped