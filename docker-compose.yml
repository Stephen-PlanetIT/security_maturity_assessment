services:
  advisory-engine:
    #build: .  # <-- THIS IS THE MISSING DIRECTIVE
    image: ghcr.io/gallenhamph/mdr-use-case:latest  
    container_name: advisory-engine
    ports:
      - "8501:8501"
    extra_hosts:                                    # <-- ADD THIS BLOCK
      - "host.docker.internal:host-gateway"         # <-- ADD THIS ROUTE
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - DOCKER_API_VERSION=1.41
      - REPO_USER=${REPO_USER}
      - REPO_PASS=${REPO_PASS}
    restart: unless-stopped